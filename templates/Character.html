{% extends 'base.html' %}
{% include 'nav.html' %}
{% block content %}



<div class="chartC">

<center><form action="/Character" method="post"> 
  <div class="container">
    <br>

    <label for="name" class="text"><b>Character name</b></label>
    <input type="text" placeholder="Enter name" name="name" required>
<br>
    <div class="multiselect-container">
      <!--creates a cointaner for the selection box and toggleDropdown() creates a drop down menu when clicked -->
  <div class="select-box" onclick="toggleDropdown()"> 
    <b>what gender are they </b>
    <select name="gender">
      <option>female</option>
      <option>male</option>
      <option>non-binary</option>
      <option>all</option>
      <option>alpha male</option>
<br>
<label for="birthday" class="text"><b>Character Birthday</b></label>
    <input type="date" id="birthday" name="birthday" required>
    
   <label for="age" class="text"><b>Character age:</b></label>
  <input type="number" id="age" name="age" min="0" max="10000000000000000" required>
  <label for="name" class="text"><b>speices</b></label>
    <input type="text" placeholder="Enter species" name="species" required>
<br>
    <label for="description" class="text"><b>Description</b></label>
    <br>
    <textarea id="description" name="description" rows="4" cols="50"> add description </textarea>
<br>
  <label for="backstory" class="text" ><b>Backstory</b></label>
    <br>
    <textarea id="backstory" name="backstory" rows="4" cols="50"> add backstory </textarea>
 <br> 

  <!-- creates a submit button for the form which adds a character to the database-->
      <button type="submit" class="addc">Add character</button>
  <!--creates a reset button so the user can reset he form and stes the forms boxes to empty -->
      <button type="reset" class="redo">reset</button>
    </div>
</form></center>
</div>

<style>
body{
/* the backgrounds image */
    background-image: url(https://i.pinimg.com/736x/94/58/b6/9458b60bbdc424ca47e8413ef6a98ac7.jpg);
    /* This shows the background in its full height */
  height: 100%; 

  /* helps Center and scale the image */
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  }
  .chartC{
  
    display: block;
    /* sets thebackground colour using rgb scale */
    background-color: rgb(218, 200, 235);
    border: 5px solid #a067b1;
    background-color: #e4c4e9;
    padding: 5em;
    margin: auto;
    height: 25em;
    width: 35em;
  text-size-adjust: 660px;
  }
.addc{
  height: 30px;
    /* sets thebackground colour using rgb scale */
  background-color: rgb(89, 39, 136);
  color: beige;
  font-style: italic;
  font-family:'Courier New', Courier, monospace
}
.addc:hover{
  background-color: rgb(53, 18, 87);
}
.text{
  color: rgb(19, 14, 87);
  height: 50px;
  width: 30px;
    font-style: normal;
  font-family: 'Times New Roman', Times, serif;
}
.redo{
  height: 30px;
  background-color: rgb(89, 39, 136);
  color: beige;
  font-style: italic;
  font-family:'Courier New', Courier, monospace
}
.redo:hover{
  background-color: rgb(53, 18, 87);
}
</style>
{% endblock %}
